steps:
  - name: "gcr.io/cloud-builders/git"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ "${_REF}" != "refs/heads/feature/mailchimp-newsletters" ]]; then
          echo "Ignoring unexpected ref: ${_REF}"
          exit 2
        fi
        if [[ ! "${_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Invalid commit SHA"
          exit 2
        fi
        git clone --no-checkout https://github.com/DAVEVERA/DENOTENMAN-WEBSHOP.git .
        git checkout --detach "${_COMMIT_SHA}"

  # The build statically reads product data. Apply only committed expand-only
  # migrations before Docker invokes `next build`. Review data backfills and
  # reader compatibility separately; additive enum values alone do not make
  # newly written rows readable by the currently serving revision.
  - id: "migrate-database"
    name: "docker.io/library/node:22-bookworm"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        npm ci --ignore-scripts --no-audit --no-fund
        export DATABASE_ACCESS_CONTEXT=release
        export DEPLOYMENT_VERSION="${_COMMIT_SHA}"
        node scripts/check-database-access.cjs migrate-release
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 10s (attempt 2/5)"
        sleep 10
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 20s (attempt 3/5)"
        sleep 20
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 30s (attempt 4/5)"
        sleep 30
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 40s (attempt 5/5)"
        sleep 40
        npx prisma migrate deploy
    secretEnv: ["DATABASE_URL"]

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        build_database_url="$$DATABASE_URL"
        if [[ "$$build_database_url" != *"connection_limit="* ]]; then
          if [[ "$$build_database_url" == *"?"* ]]; then
            build_database_url="$${build_database_url}&connection_limit=10&pool_timeout=30"
          else
            build_database_url="$${build_database_url}?connection_limit=10&pool_timeout=30"
          fi
        fi
        docker build \
          --build-arg DATABASE_URL="$$build_database_url" \
          --build-arg CDN_BASE_URL="${_CDN_BASE_URL}" \
          --build-arg SITE_URL="${_SITE_URL}" \
          --build-arg UNLIMITED_STOCK="${_UNLIMITED_STOCK}" \
          --build-arg DEPLOYMENT_VERSION="${_COMMIT_SHA}" \
          --build-arg DATABASE_ACCESS_CONTEXT=release \
          -t "${_IMAGE_BASE}:${_COMMIT_SHA}" \
          .
    secretEnv: ["DATABASE_URL"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE_BASE}:${_COMMIT_SHA}"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "update"
      - "denotenman-webshop"
      - "--image=${_IMAGE_BASE}:${_COMMIT_SHA}"
      - "--region=europe-west4"
      - "--platform=managed"
      - "--update-env-vars=GA4_PROPERTY_ID=${_GA4_PROPERTY_ID},RELEASE_EXPANDED_ENUM_WRITES=false"
      - "--no-traffic"
      - "--quiet"

images:
  - "${_IMAGE_BASE}:${_COMMIT_SHA}"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _COMMIT_SHA: "0000000000000000000000000000000000000000"
  _REF: "refs/heads/feature/mailchimp-newsletters"
  _IMAGE_BASE: "europe-west4-docker.pkg.dev/project-5dc79156-4200-4528-bfc/denotenman-webshop/storefront"
  _CDN_BASE_URL: "https://storage.googleapis.com/notenbucket"
  _SITE_URL: "https://denotenman.com"
  _GA4_PROPERTY_ID: "549991816"
  _UNLIMITED_STOCK: "true"

availableSecrets:
  secretManager:
    - versionName: "projects/project-5dc79156-4200-4528-bfc/secrets/denotenman-database-url/versions/latest"
      env: "DATABASE_URL"
