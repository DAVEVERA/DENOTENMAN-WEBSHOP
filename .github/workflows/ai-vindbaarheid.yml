name: AI Vindbaarheid quality gates

on:
  pull_request:
    paths:
      - "app/admin/(dashboard)/ai-vindbaarheid/**"
      - "app/api/admin/ai-vindbaarheid/**"
      - "lib/ai-vindbaarheid/**"
      - "lib/rendered-product-page-audit.ts"
      - "tests/ai-vindbaarheid-*.test.ts"
      - ".github/workflows/ai-vindbaarheid.yml"
      - "scripts/verify-public-storefront-html.mjs"
      - "components/product/ProductDetailContent.tsx"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "app/api/cron/geo-audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run AI Vindbaarheid regression tests
        run: npx tsx --test tests/ai-vindbaarheid-*.test.ts
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck

  live-storefront-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify raw storefront HTML without JavaScript
        run: node scripts/verify-public-storefront-html.mjs
