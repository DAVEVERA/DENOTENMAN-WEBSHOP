upstream storefront {
    server storefront:3000;
}

upstream admin {
    server admin:3003;
}

upstream api {
    server api:3001;
}

# HTTP → HTTPS redirect + certbot challenge
server {
    listen 80;
    server_name denotenman.com www.denotenman.com api.denotenman.com admin.denotenman.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Webshop — denotenman.com
server {
    listen 443 ssl;
    server_name denotenman.com www.denotenman.com;

    ssl_certificate /etc/letsencrypt/live/denotenman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denotenman.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    location / {
        proxy_pass http://storefront;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# API — api.denotenman.com
