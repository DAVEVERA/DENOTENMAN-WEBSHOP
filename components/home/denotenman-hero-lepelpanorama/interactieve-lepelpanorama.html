<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="notenman-noot-icon.png">
  <meta name="theme-color" content="#f3f0e8">
  <title>Interactief lepelpanorama</title>
  <style>
    :root {
      color-scheme: light;
      --ivory: #f3f0e8;
      --ivory-deep: #e8e3d8;
      --ink: #201c18;
      --muted: #716960;
      --focus: #cc9b55;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ivory);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 320px;
      isolation: isolate;
      background: var(--ivory);
    }

    .viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      outline: none;
      background: var(--ivory);
    }

    .viewport.is-dragging { cursor: grabbing; }

    .viewport:focus-visible {
      box-shadow: inset 0 0 0 3px var(--focus);
    }

    .world {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      pointer-events: none;
    }

    .panorama {
      position: relative;
      display: block;
      width: 8920px;
      height: 1002px;
      user-select: none;
      pointer-events: none;
    }

    .panorama-tile {
      position: absolute;
      top: 0;
      display: block;
      width: 1784px;
      height: 1002px;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .hotspots {
      position: absolute;
      inset: 0;
      width: 8920px;
      height: 1002px;
      pointer-events: none;
    }

    .spoon-layer {
      position: absolute;
      top: 0;
      height: 1002px;
      visibility: hidden;
      pointer-events: none;
    }

    .spoon-layer.is-neighbor,
    .spoon-layer.is-active,
    .spoon-layer.is-returning {
      visibility: visible;
    }

    .spoon-layer.is-neighbor {
      z-index: 2;
    }

    .spoon-layer.is-active {
      z-index: 3;
    }

    .spoon-image,
    .spoon-background {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 1002px;
      max-width: none;
      opacity: 0;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .spoon-background {
      z-index: 0;
    }

    .spoon-image {
      z-index: 1;
      transform-origin: 50% 88%;
      transition: opacity 80ms linear, transform 340ms cubic-bezier(0.22, 0.78, 0.2, 1), filter 340ms ease;
      will-change: transform;
    }

    .spoon-layer.is-neighbor .spoon-background,
    .spoon-layer.is-neighbor .spoon-image,
    .spoon-layer.is-active .spoon-background,
    .spoon-layer.is-active .spoon-image,
    .spoon-layer.is-returning .spoon-background,
    .spoon-layer.is-returning .spoon-image {
      opacity: 1;
    }

    .spoon-layer.is-neighbor .spoon-image {
      filter: drop-shadow(0 9px 8px rgba(45, 31, 18, 0.10));
      transform: translateY(-11px) scale(1.018);
    }

    .spoon-layer.is-active .spoon-image {
      filter: drop-shadow(0 21px 15px rgba(45, 31, 18, 0.20));
      transform: translateY(-38px) scale(1.065);
    }

    .spoon-layer.is-returning .spoon-image {
      filter: none;
      transform: none;
    }

    .product-hotspot {
      position: absolute;
      display: grid;
      z-index: 5;
      width: 58px;
      height: 58px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
    }

    .hotspot-icon {
      display: block;
      width: 30px;
      height: 30px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.94);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(34, 28, 22, 0.46), 0 8px 18px rgba(42, 27, 10, 0.22);
      opacity: 0.78;
      transition: opacity 180ms ease, transform 220ms cubic-bezier(0.22, 0.78, 0.2, 1), box-shadow 180ms ease;
    }

    .product-hotspot:hover .hotspot-icon,
    .product-hotspot:focus-visible .hotspot-icon,
    .product-hotspot[aria-expanded="true"] .hotspot-icon {
      opacity: 1;
      transform: scale(1.13);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.96), 0 10px 22px rgba(42, 27, 10, 0.28);
    }

    .product-hotspot:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 0;
    }

    .product-backdrop {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: none;
      border: 0;
      background: rgba(25, 20, 16, 0.30);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .product-panel {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 8;
      display: none;
      width: 264px;
      max-height: min(640px, calc(100% - 32px));
      overflow: auto;
      padding: 20px;
      border: 1px solid #d5a321;
      border-radius: 12px;
      background: #fff;
      color: #211c18;
      box-shadow: 0 24px 70px rgba(41, 30, 18, 0.24);
      overscroll-behavior: contain;
    }

    .product-panel.is-open { display: block; }

    .product-close {
      position: sticky;
      top: 0;
      z-index: 2;
      float: right;
      min-width: 58px;
      min-height: 32px;
      margin: -10px -10px 0 8px;
      border: 1px solid #ddd4c8;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: #544b42;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .product-visual {
      width: 182px;
      aspect-ratio: 1;
      margin: 2px auto 13px;
      overflow: hidden;
      border-radius: 50%;
      background: #eee7dc;
    }

    .product-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-category {
      margin: 0 0 9px;
      color: #665f58;
      font-size: 12px;
      line-height: 1.35;
    }

    .product-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 780;
      line-height: 1.16;
      letter-spacing: -0.015em;
    }

    .product-description {
      display: -webkit-box;
      margin: 0 0 14px;
      overflow: hidden;
      color: #746a61;
      font-size: 13px;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .product-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 14px;
      padding-top: 14px;
      border-top: 1px solid #e2ddd6;
    }

    .product-price {
      font-size: 17px;
      font-weight: 780;
      letter-spacing: 0.01em;
    }

    .product-weight {
      color: #776f67;
      font-size: 12px;
      font-weight: 650;
    }

    .product-actions {
      display: grid;
      gap: 10px;
    }

    .product-action {
      min-height: 40px;
      border: 0;
      border-radius: 4px;
      background: #ffbd00;
      color: #1f1a15;
      cursor: pointer;
      font-size: 12px;
      font-weight: 760;
      transition: filter 140ms ease, transform 140ms ease;
    }

    .product-action:hover { filter: brightness(0.96); }
    .product-action:active { transform: scale(0.98); }
    .product-action:focus-visible,
    .product-close:focus-visible { outline: 3px solid #5f4300; outline-offset: 2px; }

    .product-detail {
      display: none;
      margin-top: 12px;
      padding: 11px;
      border-radius: 7px;
      background: #f4efe7;
      color: #5f554b;
      font-size: 11px;
      line-height: 1.5;
    }

    .product-detail.is-open { display: block; }

    .product-source {
      display: block;
      margin-top: 5px;
      font-weight: 700;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 5;
      width: auto;
      padding: 3px;
      border: 0;
      background: transparent;
      color: #322b25;
      transform: translateX(-50%);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .control-button {
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      border: 1px solid rgba(50, 43, 37, 0.10);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
      color: inherit;
      cursor: pointer;
      opacity: 0.68;
      box-shadow: 0 4px 13px rgba(44, 34, 25, 0.08);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      transition: background 160ms ease, opacity 160ms ease, transform 160ms ease;
    }

    .control-button#play {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.56);
      opacity: 0.82;
    }

    .control-button:hover {
      background: rgba(255, 255, 255, 0.72);
      opacity: 0.92;
    }

    .control-button:active { transform: scale(0.94); }

    .control-button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      opacity: 1;
    }

    .control-button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .error {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 10;
      display: none;
      max-width: 430px;
      padding: 22px;
      border: 1px solid #d7cbbc;
      border-radius: 18px;
      background: #fffaf0;
      box-shadow: 0 16px 48px rgba(38, 29, 20, 0.16);
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .error strong { display: block; margin-bottom: 6px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .controls {
        bottom: max(7px, env(safe-area-inset-bottom));
      }

      .control-button { width: 36px; height: 36px; opacity: 0.72; }
      .control-button#play { width: 42px; height: 42px; }
      .hotspot-icon { width: 32px; height: 32px; }

      .product-backdrop.is-open { display: block; }

      .product-panel {
        position: fixed;
        left: 8px !important;
        right: 8px;
        top: auto !important;
        bottom: max(8px, env(safe-area-inset-bottom));
        width: auto;
        max-height: min(78svh, 650px);
        padding: 14px 16px 16px;
        border-radius: 18px;
      }

      .product-panel::before {
        content: "";
        display: block;
        width: 42px;
        height: 4px;
        margin: -7px auto 10px;
        border-radius: 999px;
        background: #d8d0c5;
      }

      .product-close { margin: -6px 0 0 8px; }
      .product-visual { width: 110px; margin-bottom: 8px; }
      .product-category { margin-bottom: 5px; font-size: 11px; }
      .product-title { margin-bottom: 5px; font-size: 17px; }
      .product-description { margin-bottom: 8px; line-height: 1.4; -webkit-line-clamp: 1; }
      .product-meta { margin-bottom: 9px; padding-top: 9px; }
      .product-actions { gap: 8px; }
      .product-action { min-height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }

      .spoon-layer.is-neighbor,
      .spoon-layer.is-active {
        filter: none;
        transform: none;
      }

      .spoon-layer.is-neighbor .spoon-image,
      .spoon-layer.is-active .spoon-image,
      .spoon-layer.is-returning .spoon-image {
        filter: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div
      class="viewport"
      id="viewport"
      role="application"
      aria-label="Interactief panorama van houten lepels. Sleep horizontaal of gebruik de pijltoetsen om te navigeren."
      tabindex="0"
    >
      <div class="world" id="world">
        <div
          class="panorama"
          id="panorama"
          role="img"
          aria-label="Extra breed panorama met houten lepels, noten, granen, gedroogd fruit en een honinglepel"
        >
          <img class="panorama-tile" src="panorama-tiles/panorama-01.png" width="1784" height="1002" alt="" draggable="false" decoding="async" style="left:0">
          <img class="panorama-tile" src="panorama-tiles/panorama-02.png" width="1784" height="1002" alt="" draggable="false" decoding="async" style="left:1784px">
          <img class="panorama-tile" src="panorama-tiles/panorama-03.png" width="1784" height="1002" alt="" draggable="false" decoding="async" style="left:3568px">
          <img class="panorama-tile" src="panorama-tiles/panorama-04.png" width="1784" height="1002" alt="" draggable="false" decoding="async" style="left:5352px">
          <img class="panorama-tile" src="panorama-tiles/panorama-05.png" width="1784" height="1002" alt="" draggable="false" decoding="async" style="left:7136px">
        </div>
        <div class="hotspots" id="hotspots" aria-label="Productpunten in de panorama"></div>
      </div>
    </div>

    <section class="controls" aria-label="Panoramabediening">
      <div class="controls-row">
        <div class="button-group">
          <button class="control-button" id="previous" type="button" aria-label="Naar links" title="Naar links (pijl links)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button class="control-button" id="play" type="button" aria-label="Automatische rondleiding starten" title="Automatische rondleiding (spatie)">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5Z"/></svg>
          </button>
          <button class="control-button" id="next" type="button" aria-label="Naar rechts" title="Naar rechts (pijl rechts)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div class="error" id="error" role="alert">
      <strong>De panorama kon niet worden geladen.</strong>
      Open dit HTML-bestand vanuit dezelfde map als <code>lepels-panorama.png</code>.
    </div>

    <button class="product-backdrop" id="productBackdrop" type="button" aria-label="Productkaart sluiten"></button>

    <aside class="product-panel" id="productPanel" aria-hidden="true" aria-labelledby="productTitle">
      <button class="product-close" id="productClose" type="button">Sluiten</button>
      <div class="product-visual">
        <img id="productImage" alt="" width="182" height="182">
      </div>
      <p class="product-category" id="productCategory"></p>
      <h2 class="product-title" id="productTitle"></h2>
      <p class="product-description" id="productDescription"></p>
      <div class="product-meta">
        <strong class="product-price" id="productPrice"></strong>
        <span class="product-weight" id="productWeight"></span>
      </div>
      <div class="product-actions">
        <button class="product-action" id="quickOrder" type="button">Snel bestellen</button>
        <button class="product-action" id="moreInfo" type="button" aria-expanded="false">Meer info</button>
      </div>
      <div class="product-detail" id="productDetail">
        <span id="productSku"></span>
        <span class="product-source">Gecontroleerd met productlijst 2026</span>
      </div>
    </aside>

    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>

        'amandelen-bruin-ongebrand': { sku: 'NOT-1010-250', category: 'Noten', name: 'Amandelen Bruin Ongebrand', weight: '250 gram', price: 5, image: 'product-images/amandelen-bruin-ongebrand.webp', description: 'Amandelen Bruin Ongebrand van De Notenman is een nootproduct. Gebruik het product als snack, in yoghurt, salades of bakrecepten en kies eenvoudig het gewenste gewicht.' },
        'zoete-abrikozen-gezwaveld': { sku: 'FRU-4018-250', category: 'Gedroogd fruit', name: 'Zoete Abrikozen Gezwaveld', weight: '250 gram', price: 5, image: 'product-images/zoete-abrikozen-gezwaveld.webp', description: 'Zoete Abrikozen Gezwaveld van De Notenman is gedroogd fruit. Gebruik het product in ontbijt, yoghurt, baksels of als zoete snack en kies eenvoudig het gewenste gewicht.' },
        'hazelnoten-bruin-ongebrand': { sku: 'NOT-1018-250', category: 'Noten', name: 'Hazelnoten Bruin Ongebrand', weight: '250 gram', price: 6.5, image: 'product-images/hazelnoten-bruin-ongebrand.webp', description: 'Hazelnoten Bruin Ongebrand van De Notenman is een nootproduct. Gebruik het product als snack, in yoghurt, salades of bakrecepten en kies eenvoudig het gewenste gewicht.' },
        'pistaches-gezouten': { sku: 'NOT-1007-250', category: 'Noten', name: 'Pistaches Gezouten', weight: '250 gram', price: 5, image: 'product-images/pistaches-gezouten.jpg', description: 'Pistaches Gezouten van De Notenman is een nootproduct. Gebruik het product als snack, in yoghurt, salades of bakrecepten en kies eenvoudig het gewenste gewicht.' },
        'pijnboompitten': { sku: 'PIT-7003-100', category: 'Pitten & Zaden', name: 'Pijnboompitten', weight: '100 gram', price: 4, image: 'product-images/pijnboompitten.webp', description: 'Pijnboompitten van De Notenman is een pitten- of zadenproduct. Gebruik het product in yoghurt, salades, brood of bakrecepten en kies eenvoudig het gewenste gewicht.' }
      };

      const productSequence = [
        'cashewnoten-ongebrand', 'paranoten', 'incabessen', 'acaciahoning', 'gemengde-noten-ongebrand', 'muesli', 'bananenchips',
        'incabessen', 'muesli', 'gebrande-pindas-ongezouten', 'zonnebloempitten', 'elitehaver', 'macadamias-ongebrand', 'gojibessen',
        'pecannoten-ongebrand', 'walnoten-gepeld', 'amandelen-bruin-ongebrand', 'zoete-abrikozen-gezwaveld', 'hazelnoten-bruin-ongebrand', 'pistaches-gezouten', 'pijnboompitten',
        'cashewnoten-ongebrand', 'paranoten', 'incabessen', 'acaciahoning', 'gemengde-noten-ongebrand', 'muesli', 'bananenchips',
        'incabessen', 'muesli', 'gebrande-pindas-ongezouten', 'zonnebloempitten', 'elitehaver', 'macadamias-ongebrand', 'gojibessen',
        'pecannoten-ongebrand', 'walnoten-gepeld', 'amandelen-bruin-ongebrand', 'zoete-abrikozen-gezwaveld', 'hazelnoten-bruin-ongebrand'
      ];

      const hotspotCenters = [128, 345, 562, 784, 998, 1218, 1438, 1698, 1916, 2134, 2350, 2570, 2790, 3010, 3268, 3488, 3706, 3923, 4141, 4361, 4581, 4844, 5062, 5280, 5506, 5723, 5942, 6162, 6397, 6608, 6818, 7026, 7242, 7455, 7680, 7890, 8094, 8292, 8496, 8717];
      const hotspotBoundaries = [0, ...hotspotCenters.slice(0, -1).map((center, index) => Math.floor((center + hotspotCenters[index + 1]) / 2)), 8920];
      const spoonLayers = [];
      const spoonReleaseTimers = new WeakMap();

      let activeProductId = '';
      let activeHotspot = null;
      let closeTimer = 0;
      let suppressFocusOpen = false;

      const state = {
        naturalWidth: 8920,
        naturalHeight: 1002,
        baseScale: 1,
        zoom: 1,
        x: 0,
        y: 0,
        velocityX: 0,
        velocityY: 0,
        pointers: new Map(),
        dragLastX: 0,
        dragLastY: 0,
        dragLastTime: 0,
        pinchDistance: 0,
        pinchZoom: 1,
        pinchWorldX: 0,
        pinchWorldY: 0,
        inertiaFrame: 0,
        tourFrame: 0,
        playing: false,
        tourLastTime: 0,
        interacted: false
      };

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const currentScale = () => state.baseScale * state.zoom;
      const selectedProducts = new Set();

      function formatPrice(value) {
        return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }).format(value);
      }

      function cancelScheduledClose() {
        window.clearTimeout(closeTimer);
        closeTimer = 0;
      }

      function positionProductPanel() {
        if (!activeHotspot || mobileQuery.matches || !productPanel.classList.contains('is-open')) return;
        const markerRect = activeHotspot.getBoundingClientRect();
        const markerX = markerRect.left + markerRect.width / 2;
        const markerY = markerRect.top + markerRect.height / 2;
        const width = productPanel.offsetWidth || 264;
        const height = productPanel.offsetHeight || 560;
        const gap = 24;
        const left = markerX + gap + width <= viewport.clientWidth - 16
          ? markerX + gap
          : markerX - width - gap;
        productPanel.style.left = `${clamp(left, 16, Math.max(16, viewport.clientWidth - width - 16))}px`;
        productPanel.style.top = `${clamp(markerY - 112, 16, Math.max(16, viewport.clientHeight - height - 16))}px`;
      }

      function setActiveSpoon(activeIndex = -1) {
        spoonLayers.forEach((layer, index) => {
          const distance = activeIndex < 0 ? Number.POSITIVE_INFINITY : Math.abs(index - activeIndex);
          const nextClass = distance === 0 ? 'is-active' : distance === 1 ? 'is-neighbor' : '';
          const wasRaised = layer.classList.contains('is-active') || layer.classList.contains('is-neighbor');
          const timer = spoonReleaseTimers.get(layer);
          if (timer) window.clearTimeout(timer);

          if (nextClass) {
            layer.classList.remove('is-active', 'is-neighbor', 'is-returning');
            layer.classList.add(nextClass);
            return;
          }

          if (wasRaised) {
            layer.classList.remove('is-active', 'is-neighbor');
            layer.classList.add('is-returning');
            const releaseTimer = window.setTimeout(() => layer.classList.remove('is-returning'), reducedMotion ? 0 : 360);
            spoonReleaseTimers.set(layer, releaseTimer);
          } else {
            layer.classList.remove('is-returning');
          }
        });
      }

      function populateProductPanel(productId) {
        const product = products[productId];
        if (!product) return;
        productImage.src = product.image;
        productImage.alt = product.name;
        productCategory.textContent = product.category;
        productTitle.textContent = product.name;
        productDescription.textContent = product.description;
        productPrice.textContent = formatPrice(product.price);
        productWeight.textContent = product.weight;
        productSku.textContent = `Artikel ${product.sku} · ${product.weight}`;
        productDetail.classList.remove('is-open');
        moreInfo.setAttribute('aria-expanded', 'false');
        moreInfo.textContent = 'Meer info';
        const isSelected = selectedProducts.has(productId);
        quickOrder.setAttribute('aria-pressed', String(isSelected));
        quickOrder.textContent = isSelected ? 'Toegevoegd' : 'Snel bestellen';
      }

      function openProduct(productId, hotspot, intent = 'pointer') {
        cancelScheduledClose();
        dismissCoach();
        stopTour();
        activeProductId = productId;
        activeHotspot = hotspot;
        setActiveSpoon(Number(hotspot.dataset.index));
        document.querySelectorAll('.product-hotspot[aria-expanded="true"]').forEach((button) => button.setAttribute('aria-expanded', 'false'));
        hotspot.setAttribute('aria-expanded', 'true');
        populateProductPanel(productId);
        productPanel.classList.add('is-open');
        productPanel.setAttribute('aria-hidden', 'false');
        productBackdrop.classList.toggle('is-open', mobileQuery.matches);
        window.requestAnimationFrame(positionProductPanel);
        status.textContent = `${products[productId].name} geopend.`;
        if (mobileQuery.matches && intent === 'click') productClose.focus({ preventScroll: true });
      }

      function closeProduct({ restoreFocus = false } = {}) {
        cancelScheduledClose();
        const previousHotspot = activeHotspot;
        if (activeHotspot) activeHotspot.setAttribute('aria-expanded', 'false');
        productPanel.classList.remove('is-open');
        productPanel.setAttribute('aria-hidden', 'true');
        productBackdrop.classList.remove('is-open');
        activeProductId = '';
        activeHotspot = null;
        setActiveSpoon();
        if (restoreFocus && previousHotspot) {
          suppressFocusOpen = true;
          previousHotspot.focus({ preventScroll: true });
          window.setTimeout(() => { suppressFocusOpen = false; }, 0);
        }
      }

      function scheduleProductClose() {
        if (mobileQuery.matches) return;
        cancelScheduledClose();
        closeTimer = window.setTimeout(() => closeProduct(), 190);
      }

      function initializeHotspots() {
        productSequence.forEach((productId, index) => {
          const left = hotspotBoundaries[index];
          const width = hotspotBoundaries[index + 1] - left;
          const layer = document.createElement('div');
          const background = document.createElement('img');
          const image = document.createElement('img');
          layer.className = 'spoon-layer';
          layer.style.left = `${left}px`;
          layer.style.width = `${width}px`;
          layer.setAttribute('aria-hidden', 'true');
          background.className = 'spoon-background';
          background.src = `spoon-layers/spoon-background-${String(index + 1).padStart(2, '0')}.png`;
          background.alt = '';
          background.width = width;
          background.height = 1002;
          background.draggable = false;
          background.decoding = 'async';
          image.className = 'spoon-image';
          image.src = `spoon-layers/spoon-${String(index + 1).padStart(2, '0')}.png`;
          image.alt = '';
          image.width = width;
          image.height = 1002;
          image.draggable = false;
          image.decoding = 'async';
          layer.appendChild(background);
          layer.appendChild(image);
          hotspotsElement.appendChild(layer);
          spoonLayers.push(layer);
        });

        productSequence.forEach((productId, index) => {
          const product = products[productId];
          const button = document.createElement('button');
          button.className = 'product-hotspot';
          button.type = 'button';
          button.dataset.productId = productId;
          button.dataset.index = String(index);
          button.dataset.x = String(hotspotCenters[index]);
          button.dataset.y = '175';
          button.style.left = `${hotspotCenters[index]}px`;
          button.style.top = '175px';
          button.setAttribute('aria-label', `${product.name} bekijken`);
          button.setAttribute('aria-expanded', 'false');
          button.innerHTML = '<img class="hotspot-icon" src="notenman-noot-icon.png" alt="" width="30" height="30" draggable="false">';
          button.addEventListener('pointerdown', (event) => event.stopPropagation());
          button.addEventListener('mouseenter', () => {
            if (!mobileQuery.matches) openProduct(productId, button, 'hover');
          });
          button.addEventListener('mouseleave', scheduleProductClose);
          button.addEventListener('focus', () => {
            if (!mobileQuery.matches && !suppressFocusOpen) openProduct(productId, button, 'focus');
          });
          button.addEventListener('blur', scheduleProductClose);
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            if (mobileQuery.matches && activeHotspot === button && productPanel.classList.contains('is-open')) {
              closeProduct({ restoreFocus: true });
            } else {
              openProduct(productId, button, 'click');
            }
          });
          hotspotsElement.appendChild(button);
        });
      }

      productPanel.addEventListener('mouseenter', cancelScheduledClose);
      productPanel.addEventListener('mouseleave', scheduleProductClose);
      productPanel.addEventListener('focusin', cancelScheduledClose);
      productPanel.addEventListener('focusout', (event) => {
        if (!mobileQuery.matches && !productPanel.contains(event.relatedTarget)) scheduleProductClose();
      });
      productClose.addEventListener('click', () => closeProduct({ restoreFocus: true }));
      productBackdrop.addEventListener('click', () => closeProduct({ restoreFocus: true }));

      quickOrder.addEventListener('click', () => {
        if (!activeProductId) return;
        const willSelect = !selectedProducts.has(activeProductId);
        if (willSelect) selectedProducts.add(activeProductId);
        else selectedProducts.delete(activeProductId);
        quickOrder.setAttribute('aria-pressed', String(willSelect));
        quickOrder.textContent = willSelect ? 'Toegevoegd' : 'Snel bestellen';
        status.textContent = willSelect ? `${products[activeProductId].name} toegevoegd aan je lokale selectie.` : `${products[activeProductId].name} verwijderd uit je lokale selectie.`;
      });

      moreInfo.addEventListener('click', () => {
        const willOpen = !productDetail.classList.contains('is-open');
        productDetail.classList.toggle('is-open', willOpen);
        moreInfo.setAttribute('aria-expanded', String(willOpen));
        moreInfo.textContent = willOpen ? 'Minder info' : 'Meer info';
        window.requestAnimationFrame(positionProductPanel);
      });

      function horizontalBounds() {
        const scaledWidth = state.naturalWidth * currentScale();
        const edge = Math.min(34, viewport.clientWidth * 0.035);
        return {
          max: edge,
          min: Math.min(edge, viewport.clientWidth - scaledWidth - edge)
        };
      }

      function verticalBounds() {
        const scaledHeight = state.naturalHeight * currentScale();
        const center = (viewport.clientHeight - scaledHeight) / 2;
        if (scaledHeight <= viewport.clientHeight) return { min: center, max: center };
        return { min: viewport.clientHeight - scaledHeight - 22, max: 22 };
      }

      function constrain() {
        const horizontal = horizontalBounds();
        const vertical = verticalBounds();
        state.x = clamp(state.x, horizontal.min, horizontal.max);
        state.y = clamp(state.y, vertical.min, vertical.max);
      }

      function progressValue() {
        const bounds = horizontalBounds();
        const range = bounds.max - bounds.min;
        return range <= 0 ? 0 : clamp((bounds.max - state.x) / range, 0, 1);
      }

      function render() {
        const scale = currentScale();
        if ('zoom' in world.style) {
          world.style.zoom = scale.toFixed(5);
          world.style.transform = `translate3d(${(state.x / scale).toFixed(2)}px, ${(state.y / scale).toFixed(2)}px, 0)`;
        } else {
          world.style.transform = `translate3d(${state.x.toFixed(2)}px, ${state.y.toFixed(2)}px, 0) scale(${scale.toFixed(5)})`;
        }
        positionProductPanel();
      }

      function dismissCoach() {
        state.interacted = true;
      }

      function setProgress(progress) {
        const bounds = horizontalBounds();
        state.x = bounds.max - clamp(progress, 0, 1) * (bounds.max - bounds.min);
        constrain();
        render();
      }

      function resizeLayout(preserveProgress = true) {
        const previousProgress = preserveProgress ? progressValue() : 0;
        const reserved = mobileQuery.matches ? 68 : 74;
        const usableHeight = Math.max(190, viewport.clientHeight - reserved);
        state.baseScale = usableHeight / state.naturalHeight;
        panorama.style.width = `${state.naturalWidth}px`;
        panorama.style.height = `${state.naturalHeight}px`;
        state.y = (viewport.clientHeight - state.naturalHeight * currentScale()) / 2;
        setProgress(previousProgress);
      }

      function resetView(announce = true) {
        stopTour();
        cancelInertia();
        state.zoom = 1;
        resizeLayout(false);
        if (announce) status.textContent = 'Weergave hersteld.';
      }

      function zoomAt(nextZoom, clientX = viewport.clientWidth / 2, clientY = viewport.clientHeight / 2) {
        const oldScale = currentScale();
        const worldX = (clientX - state.x) / oldScale;
        const worldY = (clientY - state.y) / oldScale;

        state.zoom = clamp(nextZoom, 1, 4);
        const newScale = currentScale();
        state.x = clientX - worldX * newScale;
        state.y = clientY - worldY * newScale;
        constrain();
        render();
      }

      function nudge(direction) {
        stopTour();
        cancelInertia();
        dismissCoach();
        state.x -= direction * viewport.clientWidth * 0.58;
        constrain();
        render();
      }

      function cancelInertia() {
        if (state.inertiaFrame) cancelAnimationFrame(state.inertiaFrame);
        state.inertiaFrame = 0;
      }

      function startInertia() {
        cancelInertia();
        if (reducedMotion || Math.abs(state.velocityX) < 0.12) return;

        const tick = () => {
          const beforeX = state.x;
          state.x += state.velocityX;
          state.y += state.velocityY;
          constrain();

          if (Math.abs(state.x - beforeX) < 0.01) state.velocityX = 0;
          state.velocityX *= 0.935;
          state.velocityY *= 0.90;
          render();

          if (Math.abs(state.velocityX) > 0.10 || Math.abs(state.velocityY) > 0.10) {
            state.inertiaFrame = requestAnimationFrame(tick);
          } else {
            state.inertiaFrame = 0;
          }
        };

        state.inertiaFrame = requestAnimationFrame(tick);
      }

      function distanceBetweenPointers() {
        const points = [...state.pointers.values()];
        if (points.length < 2) return 0;
        return Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
      }

      function pointerCenter() {
        const points = [...state.pointers.values()];
        if (points.length < 2) return { x: points[0]?.x ?? 0, y: points[0]?.y ?? 0 };
        return { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
      }

      viewport.addEventListener('pointerdown', (event) => {
        viewport.setPointerCapture(event.pointerId);
        state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        viewport.classList.add('is-dragging');
        stopTour();
        cancelInertia();
        dismissCoach();

        if (state.pointers.size === 1) {
          state.dragLastX = event.clientX;
          state.dragLastY = event.clientY;
          state.dragLastTime = performance.now();
          state.velocityX = 0;
          state.velocityY = 0;
        } else if (state.pointers.size === 2) {
          state.pinchDistance = distanceBetweenPointers();
          state.pinchZoom = state.zoom;
          const center = pointerCenter();
          const scale = currentScale();
          state.pinchWorldX = (center.x - state.x) / scale;
          state.pinchWorldY = (center.y - state.y) / scale;
        }
      });

      viewport.addEventListener('pointermove', (event) => {
        if (!state.pointers.has(event.pointerId)) return;
        state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (state.pointers.size >= 2) {
          const distance = distanceBetweenPointers();
          const center = pointerCenter();
          state.zoom = clamp(state.pinchZoom * (distance / Math.max(1, state.pinchDistance)), 1, 4);
          const scale = currentScale();
          state.x = center.x - state.pinchWorldX * scale;
          state.y = center.y - state.pinchWorldY * scale;
          constrain();
          render();
          return;
        }

        const now = performance.now();
        const deltaX = event.clientX - state.dragLastX;
        const deltaY = event.clientY - state.dragLastY;
        const elapsed = Math.max(8, now - state.dragLastTime);
        state.x += deltaX;
        state.y += deltaY;
        state.velocityX = state.velocityX * 0.58 + (deltaX / elapsed) * 16.67 * 0.42;
        state.velocityY = state.velocityY * 0.58 + (deltaY / elapsed) * 16.67 * 0.42;
        state.dragLastX = event.clientX;
        state.dragLastY = event.clientY;
        state.dragLastTime = now;
        constrain();
        render();
      });

      function releasePointer(event) {
        state.pointers.delete(event.pointerId);
        if (state.pointers.size === 1) {
          const remaining = [...state.pointers.values()][0];
          state.dragLastX = remaining.x;
          state.dragLastY = remaining.y;
          state.dragLastTime = performance.now();
        }
        if (state.pointers.size === 0) {
          viewport.classList.remove('is-dragging');
          startInertia();
        }
      }

      viewport.addEventListener('pointerup', releasePointer);
      viewport.addEventListener('pointercancel', releasePointer);

      viewport.addEventListener('wheel', (event) => {
        event.preventDefault();
        stopTour();
        cancelInertia();
        dismissCoach();

        if (Math.abs(event.deltaX) > Math.abs(event.deltaY) * 0.6 && !event.ctrlKey) {
          state.x -= event.deltaX;
          constrain();
          render();
          return;
        }

        const factor = Math.exp(-event.deltaY * 0.00115);
        zoomAt(state.zoom * factor, event.clientX, event.clientY);
      }, { passive: false });

      viewport.addEventListener('dblclick', (event) => {
        dismissCoach();
        stopTour();
        zoomAt(state.zoom > 1.15 ? 1 : 2, event.clientX, event.clientY);
      });

      document.getElementById('previous').addEventListener('click', () => nudge(-1));
      document.getElementById('next').addEventListener('click', () => nudge(1));

      function updatePlayButton() {
        playButton.setAttribute('aria-label', state.playing ? 'Automatische rondleiding pauzeren' : 'Automatische rondleiding starten');
        playButton.innerHTML = state.playing
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7v10M15 7v10"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5Z"/></svg>';
      }

      function stopTour() {
        state.playing = false;
        if (state.tourFrame) cancelAnimationFrame(state.tourFrame);
        state.tourFrame = 0;
        updatePlayButton();
      }

      function startTour() {
        if (reducedMotion) {
          status.textContent = 'Automatische beweging is uitgeschakeld vanwege je voorkeur voor minder beweging.';
          return;
        }
        cancelInertia();
        dismissCoach();
        state.playing = true;
        state.tourLastTime = performance.now();
        updatePlayButton();

        const tick = (now) => {
          if (!state.playing) return;
          const elapsed = Math.min(40, now - state.tourLastTime);
          state.tourLastTime = now;
          const bounds = horizontalBounds();
          state.x -= elapsed * 0.065;
          if (state.x <= bounds.min + 1) {
            state.x = bounds.min;
            constrain();
            render();
            stopTour();
            status.textContent = 'Einde van de panorama.';
            return;
          }
          constrain();
          render();
          state.tourFrame = requestAnimationFrame(tick);
        };
        state.tourFrame = requestAnimationFrame(tick);
      }

      playButton.addEventListener('click', () => state.playing ? stopTour() : startTour());

      viewport.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (['arrowleft', 'arrowright', ' '].includes(key)) event.preventDefault();
        if (key === 'arrowleft') nudge(-1);
        else if (key === 'arrowright') nudge(1);
        else if (key === ' ') state.playing ? stopTour() : startTour();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && productPanel.classList.contains('is-open')) {
          event.preventDefault();
          closeProduct({ restoreFocus: true });
        }
      });

      mobileQuery.addEventListener('change', () => {
        if (!productPanel.classList.contains('is-open')) return;
        productBackdrop.classList.toggle('is-open', mobileQuery.matches);
        window.requestAnimationFrame(positionProductPanel);
      });

      const panoramaTiles = [...document.querySelectorAll('.panorama-tile')];
      const showPanoramaError = () => {
        error.style.display = 'block';
        document.querySelector('.controls').style.display = 'none';
      };
      panoramaTiles.forEach((tile) => tile.addEventListener('error', showPanoramaError));

      window.addEventListener('resize', () => resizeLayout(true), { passive: true });
      new ResizeObserver(() => resizeLayout(true)).observe(viewport);

      initializeHotspots();
      resetView(false);
    })();
  </script>
</body>
