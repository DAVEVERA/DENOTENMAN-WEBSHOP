steps:
  # Apply expand-only migrations before the image build. Product pages query
  # the production database during `next build`, so the generated Prisma
  # client must never encounter a schema that is older than the checked-out
  # application code. A failed build leaves the current Cloud Run revision
  # serving normally; the additive schema remains backwards compatible.
  - id: "migrate-database"
    name: "docker.io/library/node:22-bookworm"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        npm ci --ignore-scripts --no-audit --no-fund
        # Prisma's migration advisory lock is session-scoped. Running it through
        # Neon PgBouncer can return a locked backend to the pool, so migrations
        # use the equivalent direct endpoint while the application keeps pooling.
        migration_database_url="$${DATABASE_URL/-pooler./.}"
        export DATABASE_URL="$$migration_database_url"
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 10s (attempt 2/5)"
        sleep 10
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 20s (attempt 3/5)"
        sleep 20
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 30s (attempt 4/5)"
        sleep 30
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 40s (attempt 5/5)"
        sleep 40
        npx prisma migrate deploy
    secretEnv: ["DATABASE_URL"]

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        build_database_url="$$DATABASE_URL"
        if [[ "$$build_database_url" != *"connection_limit="* ]]; then
          if [[ "$$build_database_url" == *"?"* ]]; then
            build_database_url="$${build_database_url}&connection_limit=10&pool_timeout=30"
          else
            build_database_url="$${build_database_url}?connection_limit=10&pool_timeout=30"
          fi
        fi
        docker build \
          --build-arg DATABASE_URL="$$build_database_url" \
          --build-arg CDN_BASE_URL="${_CDN_BASE_URL}" \
          --build-arg SITE_URL="${_SITE_URL}" \
          --build-arg UNLIMITED_STOCK="${_UNLIMITED_STOCK}" \
          -t "${_IMAGE}" \
          .
    secretEnv: ["DATABASE_URL"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE}"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "update"
      - "denotenman-webshop"
      - "--image=${_IMAGE}"
      - "--region=europe-west4"
      - "--platform=managed"
      - "--update-env-vars=GA4_PROPERTY_ID=${_GA4_PROPERTY_ID}"
      - "--no-traffic"
      - "--quiet"

images:
  - "${_IMAGE}"

substitutions:
  _IMAGE: europe-west4-docker.pkg.dev/project-5dc79156-4200-4528-bfc/denotenman-webshop/storefront:latest
  _CDN_BASE_URL: https://storage.googleapis.com/notenbucket
  _SITE_URL: https://denotenman.com
  _GA4_PROPERTY_ID: "549991816"
  # TEMPORARY: see UNLIMITED_STOCK note in lib/orders.ts — remove once real
  # inventory is imported. Must match the runtime Cloud Run env var, since
  # product/category pages are statically prerendered at build time.
  _UNLIMITED_STOCK: "true"

availableSecrets:
  secretManager:
    - versionName: projects/project-5dc79156-4200-4528-bfc/secrets/denotenman-database-url/versions/latest
      env: "DATABASE_URL"

options:
  logging: CLOUD_LOGGING_ONLY
