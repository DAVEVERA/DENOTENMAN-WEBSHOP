steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker build \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          --build-arg CDN_BASE_URL="${_CDN_BASE_URL}" \
          --build-arg SITE_URL="${_SITE_URL}" \
          --build-arg UNLIMITED_STOCK="${_UNLIMITED_STOCK}" \
          -t "${_IMAGE}" \
          .
    secretEnv: ["DATABASE_URL"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE}"]

  # Apply committed Prisma migrations only after the image has built and
  # pushed successfully. A migration failure stops the Cloud Run rollout.
  - id: "migrate-database"
    name: "docker.io/library/node:22-bookworm"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        npm ci --ignore-scripts --no-audit --no-fund
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 10s (attempt 2/5)"
        sleep 10
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 20s (attempt 3/5)"
        sleep 20
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 30s (attempt 4/5)"
        sleep 30
        npx prisma migrate deploy && exit 0
        echo "Prisma migrate deploy failed; retrying in 40s (attempt 5/5)"
        sleep 40
        npx prisma migrate deploy
    secretEnv: ["DATABASE_URL"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "update"
      - "denotenman-webshop"
      - "--image=${_IMAGE}"
      - "--region=europe-west4"
      - "--platform=managed"
      - "--quiet"

images:
  - "${_IMAGE}"

substitutions:
  _IMAGE: europe-west4-docker.pkg.dev/project-5dc79156-4200-4528-bfc/denotenman-webshop/storefront:latest
  _CDN_BASE_URL: https://storage.googleapis.com/notenbucket
  _SITE_URL: https://denotenman.com
  # TEMPORARY: see UNLIMITED_STOCK note in lib/orders.ts — remove once real
  # inventory is imported. Must match the runtime Cloud Run env var, since
  # product/category pages are statically prerendered at build time.
  _UNLIMITED_STOCK: "true"

availableSecrets:
  secretManager:
    - versionName: projects/project-5dc79156-4200-4528-bfc/secrets/denotenman-database-url/versions/latest
      env: "DATABASE_URL"
